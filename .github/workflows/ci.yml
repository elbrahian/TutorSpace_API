name: CI Backend

on:
  push:
    branches: ['**']
  pull_request:
    branches: [Develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn clean verify